name: CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'biometric-bridge/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'biometric-bridge/**'
      - '.github/workflows/**'

env:
  GO_VERSION: '1.24.7'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          go install golang.org/x/lint/golint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run go fmt
        working-directory: biometric-bridge
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        working-directory: biometric-bridge
        run: go vet ./...

      - name: Run staticcheck
        working-directory: biometric-bridge
        run: staticcheck ./...

      - name: Run tests
        working-directory: biometric-bridge
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./biometric-bridge/coverage.out
          flags: unittests
          name: codecov-umbrella

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libgtk-3-dev

      - name: Build Linux Bridge
        working-directory: biometric-bridge
        run: |
          CGO_ENABLED=1 go build -tags realscan -o bridge-realscan ./cmd/bridge
          ./bridge-realscan --version || true

      - name: Build Linux Tray
        working-directory: biometric-bridge
        run: |
          CGO_ENABLED=1 go build -o bridge-tray ./cmd/tray
          file bridge-tray

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Windows Bridge
        working-directory: biometric-bridge
        shell: cmd
        run: |
          set CGO_ENABLED=1
          set GOOS=windows
          set GOARCH=amd64
          go build -tags realscan -ldflags="-H windowsgui" -o bridge-realscan.exe ./cmd/bridge

      - name: Build Windows Tray
        working-directory: biometric-bridge
        shell: cmd
        run: |
          set CGO_ENABLED=1
          set GOOS=windows
          set GOARCH=amd64
          go build -ldflags="-H windowsgui" -o bridge-tray.exe ./cmd/tray

      - name: Verify builds
        working-directory: biometric-bridge
        shell: pwsh
        run: |
          if (!(Test-Path bridge-realscan.exe)) {
            Write-Error "bridge-realscan.exe not found"
            exit 1
          }
          if (!(Test-Path bridge-tray.exe)) {
            Write-Error "bridge-tray.exe not found"
            exit 1
          }
          Write-Host "✓ Both executables built successfully"
          Get-Item bridge-realscan.exe, bridge-tray.exe | Format-Table Name, Length

  build-windows-cross:
    name: Build Windows (Cross-compile)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cross-compile Windows Bridge
        working-directory: biometric-bridge
        run: |
          chmod +x build-windows-cross.sh
          ./build-windows-cross.sh

      - name: Verify cross-compiled binary
        working-directory: biometric-bridge
        run: |
          if [ ! -f bridge-realscan.exe ]; then
            echo "Error: bridge-realscan.exe not found"
            exit 1
          fi
          file bridge-realscan.exe
          ls -lh bridge-realscan.exe
